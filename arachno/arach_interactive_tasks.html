    // Перемешиваем массив задач
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const shuffledTasks = shuffle(tasks);

    // Рендерим задачи
    const container = document.getElementById('tasksContainer');
    shuffledTasks.forEach((task, index) => {
        const card = document.createElement('div');
        card.className = 'task-card';

        const numberDiv = document.createElement('div');
        numberDiv.className = 'task-number';
        numberDiv.textContent = `Задача ${index + 1}`;
        card.appendChild(numberDiv);

        const textDiv = document.createElement('div');
        textDiv.className = 'task-text';
        textDiv.innerHTML = task.text;
        card.appendChild(textDiv);

        const inputArea = document.createElement('div');
        inputArea.className = 'task-input-area';

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Введите ваш ответ...';
        inputArea.appendChild(input);

        const btn = document.createElement('button');
        btn.className = 'task-btn';
        btn.textContent = 'Показать ответ';
        inputArea.appendChild(btn);

        card.appendChild(inputArea);

        const answerDiv = document.createElement('div');
        answerDiv.className = 'task-answer';
        answerDiv.innerHTML = task.answer;
        card.appendChild(answerDiv);

        btn.addEventListener('click', function() {
            answerDiv.classList.toggle('show');
            this.textContent = answerDiv.classList.contains('show') ? 'Скрыть ответ' : 'Показать ответ';
        });

        container.appendChild(card);
    });
</script>
